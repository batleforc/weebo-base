from_latest_tag = true
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
post_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

pre_bump_hooks = []


[git_hooks]

[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file "$1"
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
unstaged=$(mktemp)
trap 'rm -f "$unstaged"' EXIT
git -c core.quotePath=false diff --name-only > "$unstaged"
task recu # a file generated here is only committed if already staged: `git add <path>` it in the recu task
.hooks/restage.sh "$unstaged"
task lint
.hooks/restage.sh "$unstaged" # in case linting fixed anything
.hooks/end-of-line.sh
.hooks/whitespace-fixer.sh
gitleaks git --pre-commit --redact --staged --verbose
"""

[commit_types]
release = { changelog_title = "Releases" }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "weebo-base"
owner = "batleforc"

[bump_profiles]
