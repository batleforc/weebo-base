name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Only the PR commits: `cog check` fails without a tag, and GitHub's template "Initial commit" is not conventional.
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            cog verify "$(git log -1 --format=%B "$c")"
          done
      - run: gitleaks git --redact --verbose
      - run: task lint
      - run: task audit
